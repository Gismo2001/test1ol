<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="Tabelle" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BW Tabelle</title>
  <link href="./tabulator.min.css" rel="stylesheet">
  <style>
    body { margin: 0; padding: 0; overflow: hidden; }
    #example-table { height: 100vh; width: 100vw; }
  </style>
</head>
<body>

<div id="example-table"></div>
<script src="./tabulator.min.js"></script>
<script>
// Sicherheit: Den eigenen Ursprung für postMessage speichern
const targetOrigin = window.location.origin;

let table = new Tabulator("#example-table", {
  layout: "fitDataFill", // Nutzt den Platz besser aus
  placeholder: "Lade Daten..., ggf. Zoomen oder Pan", // Falls die Liste mal leer ist
  persistence:{
      sort:true,
      filter:true,
      columns:true,
    },
  columns: [
    { title: "ID", field: "ID_con"},
    { title: "Name", field: "name"},
    { title: "BW ID", field: "bw_id" },
    { title: "Station", field: "station"},
    { title: "U_Pflicht", field: "upflicht"},
    { title: "Bauart", field: "bauart"},
    {
      title: "Beschreibung",
      field: "beschreib",
      widthGrow: 3, // Nimmt verfügbaren Platz flexibel ein
      formatter: "plaintext"
    },
  ]
});

// 📥 Daten sicher empfangen
window.addEventListener("message", (event) => {
  // Nur Nachrichten vom eigenen Server akzeptieren
  if (event.origin !== targetOrigin) return;
  
  if (event.data.type === "setData") {
    table.setData(event.data.data);
  }
});

// 📤 Events sicher an die Hauptkarte senden
table.on("rowMouseEnter", function (e, row) {
  const data = row.getData();
  if (data.ID_con) {
    window.opener.postMessage({
      type: "highlightFeature",
      id: data.ID_con
    }, targetOrigin); // ✅ Sicherheit: targetOrigin statt "*"
  }
});



table.on("rowDblClick", function (e, row) {
  const data = row.getData();
  if (data.ID_con) {
    window.opener.postMessage({
      type: "zoomToFeature",
      id: data.ID_con
    }, targetOrigin); // ✅ Sicherheit: targetOrigin statt "*"
  }
});

// 🧹 Optional: Highlight löschen, wenn Maus die Tabelle verlässt
table.on("tableMouseOut", function() {
  window.opener.postMessage({ type: "clearHighlight" }, targetOrigin);
});
</script>

</body>
</html>
