<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>BW Tabelle</title>
  <link href="https://unpkg.com/tabulator-tables@5.5.0/dist/css/tabulator.min.css" rel="stylesheet">
  <style>
    body { margin: 0; }
    #example-table { height: 100vh; }
  </style>
</head>
<body>

<div id="example-table"></div>
<script src="https://unpkg.com/tabulator-tables@5.5.0/dist/js/tabulator.min.js"></script>
<script>
let table = new Tabulator("#example-table", {
  layout: "fitDataStretch",
  columns: [
    { title: "ID", field: "ID_con" },
    { title: "Name", field: "name" },
    {
      title: "Beschreibung",
      field: "beschreib",
      width: 300,              // ✅ feste Breite
      formatter: function(cell){
        return cell.getValue();
      }
    },
    { title: "BW ID", field: "bw_id" },
    { title: "Station", field: "station" }
  ]
});

  // 📥 Daten empfangen
  window.addEventListener("message", (event) => {
    if (event.data.type === "setData") {
      table.setData(event.data.data);
    }
  });
  table.on("rowMouseEnter", function (e, row) {
   const data = row.getData();
    window.opener.postMessage({
    type: "highlightFeature",
    id: data.ID_con
  }, "*");
  });
  table.on("rowDblClick", function (e, row) {
  const data = row.getData();

  window.opener.postMessage({
    type: "zoomToFeature",
    id: data.ID_con
  }, "*");
});
</script>

</body>
</html>
